name: DSA Application CSS Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dsa-css-check:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run DSA application CSS test
        run: |
          pytest -v -s test_dsa_app.py

      - name: Upload test screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsa-css-check-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
